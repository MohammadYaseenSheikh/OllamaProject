# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - resume-scanner-app

on:
  push:
    branches:
      - prod/deploymen-azure
  workflow_dispatch:

env:
  AZURE_APP_NAME: resume-scanner-app
  JAVA_VERSION: 21

jobs:
  build:
    name: 🔨 Build JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'
          cache: 'maven'

      - name: 🔨 Build with Maven
        run: mvn clean install

      - name: 📤 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 1

  deploy:
    name: 🚀 Deploy to PROD
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FCB3BE0D1D77492E9335919317E443E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A2CFFF5C7084A319121CCD907AFEB02 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8B415D2FFD124498A11B72D6B45D39BF }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          slot-name: 'Production'
          package: '*.jar'

      - name: ✅ Deployment Success
        run: |
          echo "🎉 Deployed ${{ env.AZURE_APP_NAME }} on ${{ github.ref_name }} to PROD"
          echo "📝 Branch: ${{ github.ref_name }}"
          echo "💾 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"
